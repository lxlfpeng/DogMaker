#任务名称
name: DogMaker-Data-Crawl-and-Publish
# 触发 workflow 的事件
# on:
#   schedule:
#     - cron: '45 05 * * *'

on:
  push:
    branches:
      - main
  schedule:
    - cron: '45 05 * * *'

# 一个workflow由执行的一项或多项job
jobs:
  # 一个job任务，任务名为build
  build:
    #使用ubuntu的运行环境 版本为最新版
    runs-on: ubuntu-latest
    #步骤
    steps:
    #拉取代码（浅克隆，只取最近4个提交，加上本次提交共保留5个）
    - name: checkout actions
      uses: actions/checkout@v4
      with:
        fetch-depth: 4
    #配置Python环境
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    #通过requirements.txt安装项目依赖
    - name: install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    #执行Python文件
    - name: run python
      env:
        # 大模型翻译配置（在仓库 Settings -> Secrets 里配置）
        LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
        LLM_MODEL: ${{ secrets.LLM_MODEL }}
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      run: |
        # ⚠️ 必须带引号：EMAIL_TOKEN 未配置时表达式展开为空，光杆 `--email_pass` 会让 argparse 报错退出（exit 2）
        python run.py --email_pass "${{ secrets.EMAIL_TOKEN }}"
    #Git提交并强制推送到仓库（只保留最近5个提交）
    # 原理：每次都用 git commit-tree 重建全部 5 个提交，确保最老的提交没有父节点（根提交），
    #       这样 force push 后远端历史就被真正截断了，老的提交链不再可达。
    - name: commit and push
      run: |
        git config --global user.email "565289282@qq.com"
        git config --global user.name "lxlfpeng"

        # 先提交本次改动
        git add .
        git commit -m "update" -a || echo "No changes to commit"

        KEEP=5
        COMMIT_COUNT=$(git rev-list --count HEAD)
        echo "当前提交数: $COMMIT_COUNT"

        # 重建最近 KEEP 个提交，全部用新对象，确保最老的是根节点（切断与旧历史的联系）
        if [ "$COMMIT_COUNT" -ge "$KEEP" ]; then
          # 取最近 KEEP 个提交，从旧到新
          COMMITS=$(git rev-list HEAD | head -$KEEP | tac)

          PARENT=""
          for sha in $COMMITS; do
            export GIT_COMMITTER_DATE="$(git log -1 --format=%cI "$sha")"
            TREE=$(git rev-parse "$sha^{tree}")
            MSG=$(git log -1 --format=%s "$sha")

            if [ -z "$PARENT" ]; then
              # 第一个（最老的）：根提交，无父节点
              PARENT=$(git commit-tree "$TREE" -m "$MSG")
            else
              # 后续：有父节点
              PARENT=$(git commit-tree "$TREE" -p "$PARENT" -m "$MSG")
            fi
          done

          # 把 main 指向新链的顶端
          git update-ref refs/heads/main "$PARENT"
          echo "历史重建完成，新提交数: $(git rev-list --count HEAD)"
        fi

        git push --force origin main || echo "Nothing to push"

 
